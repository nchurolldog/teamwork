<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>软件学院信息管理系统-登录</title>
  <script src="https://kit.fontawesome.com/b81ce93c93.js" crossorigin="anonymous"></script>
  <link rel="shortcut icon" href="../img/favicon.ico" type="image/x-icon">
  
  <style>

  body {
    margin: 0;
    padding: 0;
    font-family: 'Arial', sans-serif;
    background-color: #f0f2f5; 
    display: flex;
    justify-content: center; 
    align-items: center;   
    min-height: 100vh;
  }


  .login-container {
    display: flex;
    width: 90%;
    max-width: 1200px;
    height: 800px;   
    background-color: #fff;
    border-radius: 20px;
    overflow: hidden; 
    box-shadow: 0 15px 35px rgba(0,0,0,0.1);
  }
  .enterprisename {
    font-size: 20px;
    color: black;
    margin-bottom: 60px;
    display: flex;
    align-items: center;
  }
  .left {
    flex: 1;
    padding: 80px;
    
    box-sizing: border-box;
    background-color: #fff;
    color: black;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .right {
    flex: 1.2; 
    background-color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px; 
  }

  .right img {
    width: 100%;
    height: 100%;
 
    border-radius: 15px;
  }

 
  input {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border: 1px solid #ddd;
    border-radius: 8px;
    box-sizing: border-box;
  }

 
  input[type="text"],
  input[type="password"]{
    -webkit-appearance: none;
    appearance: none;
  }

  button {
    background: #7e01fb;
    color: #ffffff;
    padding: 10px 30px;
    border-radius: 5px;
    font-weight: bold;
    cursor: pointer;
    border: none;
    text-align: center;
    margin-top: 50px;
  }
  button:hover {
    background: skyblue;
    color: #7e01fb;
  }
  
  .tips{
    color:grey;
     margin-bottom: 40px;
  }

  .reme{
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
  }
  .reme input[type="checkbox"]{
    width: 16px;
    height: 16px;
    margin: 0;
  }
  .reme a{ 
    color: grey;
    margin-left: auto;
    text-decoration: none;
    font-size: 14px;
  }
  .hints {
    margin-top: 60px;
   color:grey;
  }
  .hints a{
    color: #7e01fb;
    text-decoration: none;
    font-weight: bold;
  }


  .left {
    transition: all 0.8s ease-in-out;
    position: relative;
  }

  .left.slide-out-left {
    opacity: 0;
    transform: translateX(-100%);
  }

  /* 右侧容器动画 */
  .right {
    transition: all 0.8s ease-in-out;
    position: relative;
  }

  .right.slide-out-right {
    opacity: 0;
    transform: translateX(100%);
  }

  /* 隐藏的注册表单和左侧图片 - 初始状态隐藏 */
  .signup-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    opacity: 0;
    transform: translateX(100%);
    transition: all 0.8s ease-in-out 0.3s;
    pointer-events: none;
  }

  .signup-container.show {
    opacity: 1;
    transform: translateX(0);
    pointer-events: auto;
  }

  .signup-left {
    flex: 1.2;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px;
    background-color: #fff;
    overflow: hidden;
  }

  .signup-left img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 15px;
  }

  .signup-right {
    flex: 1;
    padding: 80px;
    box-sizing: border-box;
    background-color: #fff;
    color: black;
    display: flex;
    flex-direction: column;
    justify-content: center;
    overflow-y: auto;
  }

  .signup-form h1 {
    margin-top: 0;
    margin-bottom: 30px;
    font-size: 28px;
  }

  .signup-form p {
    color: grey;
    margin-bottom: 20px;
  }

  .signup-form input {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border: 1px solid #ddd;
    border-radius: 8px;
    box-sizing: border-box;
  }



  .back-to-login {
    margin-top: 30px;
    text-align: center;
    color: grey;
  }

  .back-to-login a {
    color: #7e01fb;
    text-decoration: none;
    font-weight: bold;
    cursor: pointer;
  }
.signup-button{
  color: #ffffff;
  background-color:rgb(26, 233, 164) ;
}
.signup-button:hover{
  background-color: pink;
  color: rgb(26, 233, 164);
}
  /* 绝对定位容器 */
  .login-container {
    position: relative;
  }
  </style>
   
   
</head>
<body>
    <div class="login-container"> <div class="left">
            <div class="enterprisename">
                <span class="fas fa-seedling"></span> <strong>SeInfor</strong>
            </div>
            <div class="welcome">
                <h1>Hello,<br>Welcome Back</h1>
                <p class="tips">Hey, welcome back to your special place</p>
            </div>
            <div class="postinfor">
                <form action="">
                    <input type="text" placeholder="Username" required>
                    <input type="password" placeholder="Password" required>
                    <div class="reme"> 
                      <label for="remember">Remember me</label>
                        <input type="checkbox" id="remember">
                       
                        <a href="#">Forgot password?</a>
                    </div>
                </form>
            </div>
            <div class="buttons">
                <button>sign in</button>
            </div>
            <div class="hints">
                <p>Don't have an account? 
                   <a href="#">Sign up</a>
                </p>
            </div>
        </div>

        <div class="right">
            <img src="../img/right-ilu.webp" alt="illustration">
        </div>

        <!-- 注册界面 -->
        <div class="signup-container">
            <div class="signup-left">
                <img src="../img/left-ilu.png" alt="signup illustration">
            </div>
            <div class="signup-right">
                <form class="signup-form" action="">
                    <h1>Create Account</h1>
                    <p>Join us today and get started</p>
                     
                    <input type="username" placeholder="Username" required>
                    <input type="password" placeholder="Password" required>
                    <input type="password" placeholder="Confirm Password" required>
                    <button type="submit" class="signup-button" >Sign up</button>
                    <div class="back-to-login">
                        <p>Already have an account? 
                           <a href="#" onclick="backToLogin()" style="color: rgb(26, 233, 164);" >Sign in</a>
                        </p>
                    </div>
                </form>
            </div>
        </div>
    </div>
   </body>
   <script>
    // 获取DOM元素
    const loginContainer = document.querySelector('.login-container');
    const leftSection = document.querySelector('.left');
    const rightSection = document.querySelector('.right');
    const signupContainer = document.querySelector('.signup-container');
    const signupLink = document.querySelector('.hints a');

    // 点击"Sign up"跳转到注册页面
    signupLink.addEventListener('click', (e) => {
        e.preventDefault();
        
        // 添加滑出动画类
        leftSection.classList.add('slide-out-left');
        rightSection.classList.add('slide-out-right');
        
        // 延迟显示注册容器
        setTimeout(() => {
            signupContainer.classList.add('show');
        }, 100);
    });

    // 返回登录页面
    function backToLogin() {
        // 移除注册容器的show类
        signupContainer.classList.remove('show');
        
        // 延迟移除登录的滑出类，使登录页面重新显示
        setTimeout(() => {
            leftSection.classList.remove('slide-out-left');
            rightSection.classList.remove('slide-out-right');
        }, 100);
    }
   </script>
</html>
